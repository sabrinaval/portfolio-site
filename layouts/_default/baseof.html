<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Portfolio</title>
    <!-- Hugo will process your Tailwind CSS file here -->
    <script src="tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans">
    
    <!-- Shared Minimal Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/" class="font-bold tracking-tight text-lg">Your Name</a>
            <div class="space-x-6 text-sm font-medium text-slate-600">
                <a href="/reporting/" class="hover:text-slate-900 transition">Data Journalism</a>
                <a href="/creative/" class="hover:text-slate-900 transition">Creative Writing</a>
            </div>
        </div>
    </nav>

    <!-- Page Content Injection Point -->
    <main>
        {{ block "main" . }}{{ end }}
    </main>

</body>
</html>
