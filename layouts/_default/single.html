{{ define "main" }}
<article class="max-w-3xl mx-auto px-6 py-16">
    
    <!-- Meta details (reads the top section of your markdown files) -->
    <header class="mb-12 border-b border-slate-200 pb-8">
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 block mb-3">
            {{ .Section }}
        </span>
        <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-4 font-serif">
            {{ .Title }}
        </h1>
        <time class="text-sm text-slate-500 block">
            Published on {{ .Date.Format "January 2, 2006" }}
        </time>
    </header>

    <!-- Content Injection (renders your actual markdown sentences and images) -->
    <div class="prose prose-slate max-w-none text-slate-800 font-serif leading-relaxed text-lg space-y-6">
        {{ .Content }}
    </div>

</article>
{{ end }}
