baseURL = "https://sabrinavalerjev.com/"
locale = "en-US"
title = "Sabrina Valerjev — Journalist & Writer"

# Enable HTML in markdown (needed for custom callouts, data tables, etc.)
[markup.goldmark.renderer]
  unsafe = true

# Syntax highlighting for code blocks in reporting pieces
[markup.highlight]
  style = "github-dark"
  lineNos = false
  noClasses = false

# Summary length for article cards
summaryLength = 30

# Pagination
paginate = 12

[params]
  author        = "Sabrina Valerjev"
  description   = "Data journalist and writer covering systemic public issues."
  twitterHandle = "@yourhandle"
  email         = "you@example.com"
  signalNumber  = "+1-XXX-XXX-XXXX"

# These drive the navbar (optional — you can also hardcode in baseof.html)
[[menus.main]]
  name   = "Investigations"
  url    = "/reporting/"
  weight = 1

[[menus.main]]
  name   = "Creative"
  url    = "/creative/"
  weight = 2

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 3

[[menus.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 4

# Taxonomy — lets you filter by tag on list pages
[taxonomies]
  tag   = "tags"
  genre = "genres"
